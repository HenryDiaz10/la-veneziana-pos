<!doctype html>
<!-- Indicamos que el documento utiliza HTML moderno. -->

<!-- Declaramos español como idioma de la página. -->
<html lang="es">
  <head>
    <!-- Permitimos mostrar correctamente acentos y otros caracteres. -->
    <meta charset="UTF-8" />

    <!-- Adaptamos el ancho de la página al dispositivo.
         Conservamos la posibilidad de ampliar mediante zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Definimos el nombre que aparece en la pestaña del navegador. -->
    <title>Pizzería La Veneziana</title>
  </head>

  <body>
    <!-- React mostrará la aplicación dentro de este elemento.
         main.jsx lo identifica mediante el id "root". -->
    <div id="root"></div>

    <!-- Cargamos el archivo que inicia React.
         type="module" permite utilizar import y export. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
